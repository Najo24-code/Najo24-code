<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Jonas Suárez · DevOps &amp; Cloud Engineer</title>
  <desc id="d">Focus: CI/CD, infrastructure as code, Kubernetes, Google Cloud. Using: Linux, Docker, GitHub Actions, Python, PostgreSQL. Practicing: Terraform, Kubernetes, Prometheus, Grafana. Based in the Dominican Republic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0f1722"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.35" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="15.5" fill="none" stroke="#262c36"/>

  <!-- command -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="22">
    <text x="72" y="84" fill="#3fb950">$</text>
    <text x="98" y="84" fill="#8b949e">kubectl describe engineer jonas-suarez</text>
  </g>

  <!-- identity -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="168" font-size="68" font-weight="700" fill="#f0f6fc">Jonas Suárez</text>
    <text x="72" y="216" font-size="32" font-weight="600" fill="#58a6ff">DevOps &amp; Cloud Engineer</text>
  </g>
  <rect x="72" y="246" width="1056" height="2" fill="url(#rule)"/>

  <!-- describe output -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="23">
    <g fill="#6e7681">
      <text x="72" y="300">Focus:</text>
      <text x="72" y="346">Using:</text>
      <text x="72" y="392">Practicing:</text>
      <text x="72" y="438">Location:</text>
    </g>
    <g fill="#c9d1d9">
      <text x="290" y="300">CI/CD · Infrastructure as Code · Kubernetes · GCP</text>
      <text x="290" y="346">Linux · Docker · GitHub Actions · Python · PostgreSQL</text>
      <text x="290" y="392">Terraform · Kubernetes · Prometheus · Grafana</text>
      <text x="290" y="438">Dominican Republic</text>
    </g>
  </g>

  <!-- status pill, top right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="852" y="56" width="276" height="38" rx="19" fill="#0f2417" stroke="#2ea043"/>
    <circle cx="878" cy="75" r="6" fill="#3fb950"/>
    <text x="896" y="82" fill="#3fb950">Running · lab active</text>
  </g>
</svg>
