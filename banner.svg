<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="280" viewBox="0 0 1024 280" role="img" aria-label="Jonas Suárez — Junior DevOps · República Dominicana">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="280" fill="url(#bg)"/>
  <rect width="1024" height="280" fill="url(#glow)"/>

  <!-- subtle bottom accent line -->
  <rect x="0" y="276" width="1024" height="4" fill="#58a6ff" opacity="0.6"/>

  <!-- Title -->
  <text x="512" y="82" text-anchor="middle" dominant-baseline="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#e6edf3">Jonas Suárez</text>

  <!-- Role -->
  <text x="512" y="145" text-anchor="middle" dominant-baseline="middle"
        font-family="monospace" font-size="28" font-weight="700" fill="#58a6ff">$ whoami → Junior DevOps · República Dominicana</text>

  <!-- Comment -->
  <text x="512" y="192" text-anchor="middle" dominant-baseline="middle"
        font-family="monospace" font-size="20" fill="#8b949e"># soy junior y lo asumo: aprendo rompiendo cosas mías (y arreglándolas).</text>

  <!-- Footer + cursor -->
  <text x="512" y="244" text-anchor="middle" dominant-baseline="middle"
        font-family="monospace" font-size="22" fill="#58a6ff">jonas@homelab:~$ git push origin main<tspan fill="#e6edf3">▍</tspan></text>
</svg>
