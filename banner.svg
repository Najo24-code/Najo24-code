<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="280" viewBox="0 0 1024 280" role="img" aria-label="Jonas Suárez — Junior Developer · Dominican Republic">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="280" fill="url(#bg)"/>
  <rect width="1024" height="280" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1024" height="3" fill="url(#accent)" opacity="0.8"/>

  <!-- Terminal window chrome -->
  <rect x="40" y="20" width="944" height="240" rx="8" ry="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="20" width="944" height="32" rx="8" ry="8" fill="#161b22"/>
  <rect x="40" y="44" width="944" height="8" fill="#161b22"/>

  <!-- Terminal dots -->
  <circle cx="60" cy="36" r="5" fill="#ff5f57"/>
  <circle cx="78" cy="36" r="5" fill="#febc2e"/>
  <circle cx="96" cy="36" r="5" fill="#28c840"/>

  <!-- Terminal title -->
  <text x="512" y="38" text-anchor="middle" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="13" fill="#8b949e">jonas@dev:~</text>

  <!-- Prompt line 1: whoami -->
  <text x="64" y="82" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="15" fill="#3fb950">$</text>
  <text x="80" y="82" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="15" fill="#e6edf3">whoami</text>

  <!-- Output: name -->
  <text x="64" y="112" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="36" font-weight="700" fill="#e6edf3">Jonas Suárez</text>

  <!-- Output: role -->
  <text x="64" y="148" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="18" fill="#58a6ff">Junior Developer</text>
  <text x="290" y="148" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="18" fill="#8b949e">·</text>
  <text x="310" y="148" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="18" fill="#8b949e">Dominican Republic</text>

  <!-- Prompt line 2: stack -->
  <text x="64" y="188" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="15" fill="#3fb950">$</text>
  <text x="80" y="188" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="15" fill="#e6edf3">echo $STACK</text>

  <!-- Stack output -->
  <text x="64" y="218" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="16" fill="#8b949e">Python · FastAPI · PostgreSQL · Docker · Linux · Next.js</text>

  <!-- Cursor line -->
  <text x="64" y="250" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="15" fill="#3fb950">$</text>
  <text x="80" y="250" dominant-baseline="middle"
        font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
        font-size="15" fill="#e6edf3">_</text>
  <rect x="80" y="238" width="8" height="18" fill="#3fb950" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent line -->
  <rect x="0" y="276" width="1024" height="4" fill="url(#accent)" opacity="0.6"/>
</svg>
